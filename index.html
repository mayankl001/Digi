<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Tags -->
    <title>DigiSaloon | Smart Salon & Spa Booking Platform in Ranchi</title>
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="description" content="Book hair, beauty, and spa appointments at premium salons in Ranchi instantly. Compare prices, check live slots, and enjoy zero waiting time with DigiSaloon." />
    
    <!-- 🟢 FIX FOR 100 SEO: Add Canonical Tag -->
    <link rel="canonical" href="https://digisaloon.in/" />
    
    <!-- Google Crawling -->
    <meta name="robots" content="index, follow" />

    <!-- 🚀 PERFORMANCE OPTIMIZATIONS -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/logo.png" type="image/png" />

    <!-- Global Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DigiSaloon" />
    <meta property="og:title" content="DigiSaloon | Premium Salon Experience in Ranchi" />
    <meta property="og:description" content="Discover verified premium salons in Ranchi, check live availability, and book slots instantly." />
    <meta property="og:image" content="https://digisaloon.in/og-image.png" />
    <meta property="og:url" content="https://digisaloon.in/" />

    <!-- Global Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DigiSaloon | Premium Salon Experience in Ranchi" />
    <meta name="twitter:description" content="Skip the salon queues. Book trusted salon and spa treatments instantly across Ranchi." />
    <meta name="twitter:image" content="https://digisaloon.in/og-image.png" />

    <style>
      html { 
        scroll-behavior: smooth;
      } 
      body { 
        margin: 0; 
        min-height: 100vh;
        background-color: #FAFAFA;
        overflow-x: clip;
      } 
      #root { 
        min-height: 100vh; 
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
